<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedding Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#fbf4e6; --bg2:#e9d4ab; --title:#6b1a2e; --muted:#7d5a3c; --gold:#a97a24;
  --card1:#4d1327; --card2:#2d0915; --card3:#3b0e1c; --digit:#f3d68f;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --script:"Great Vibes","Brush Script MT","Segoe Script",cursive;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg1:#3d0e1e; --bg2:#12040a; --title:#f3d68f; --muted:#cfae82; --gold:#e2bb66;}
}
:root[data-theme="dark"]{--bg1:#3d0e1e; --bg2:#12040a; --title:#f3d68f; --muted:#cfae82; --gold:#e2bb66;}
*{box-sizing:border-box}
html{height:100%}
body{
  margin:0;min-height:100%;
  background-color:var(--bg2);
  background-image:radial-gradient(ellipse 90% 70% at 50% 0%,var(--bg1) 0%,var(--bg2) 80%);
  background-attachment:fixed;
  color:var(--title);font-family:var(--serif);
  display:flex;align-items:center;justify-content:center;
}
.sparkles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sparkles i{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold);opacity:.25;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.1;transform:scale(.7)}50%{opacity:.85;transform:scale(1.3)}}
main{position:relative;z-index:1;width:100%;max-width:1000px;padding:32px 24px;text-align:center}
.rings{width:clamp(56px,10vw,84px);color:var(--gold);margin-bottom:6px}
h1{font-family:var(--script);font-weight:400;font-size:clamp(2.8rem,10vw,6rem);line-height:1.05;margin:0;color:var(--title);text-shadow:0 2px 18px rgba(169,122,36,.25)}
.sub{font-size:clamp(1.15rem,3.6vw,1.7rem);font-style:italic;color:var(--muted);margin:10px 0 clamp(26px,5vw,48px)}
.clock{--s:clamp(60px,calc((100vw - 48px) / 4.7),180px);display:flex;justify-content:center;gap:calc(var(--s)*.14)}
.unit{display:flex;flex-direction:column;align-items:center;gap:calc(var(--s)*.14)}
.label{font-size:max(13px,calc(var(--s)*.2));color:var(--gold);letter-spacing:.06em;font-weight:700}
.card{
  position:relative;width:calc(var(--s)*.95);height:calc(var(--s)*1.25);
  perspective:calc(var(--s)*5);border-radius:calc(var(--s)*.1);
  box-shadow:0 14px 32px rgba(40,6,18,.38),0 0 0 1px rgba(226,187,102,.55);
  font-size:calc(var(--s)*.95);
}
.card.wide{width:calc(var(--s)*1.4)}
.half{
  position:absolute;left:0;right:0;height:50%;overflow:hidden;
  background:linear-gradient(var(--card1),var(--card2));
  backface-visibility:hidden;
}
.top{top:0;border-radius:calc(var(--s)*.1) calc(var(--s)*.1) 0 0}
.bot{bottom:0;border-radius:0 0 calc(var(--s)*.1) calc(var(--s)*.1);background:linear-gradient(var(--card2),var(--card3))}
.half span{
  position:absolute;left:0;right:0;height:200%;display:flex;align-items:center;justify-content:center;
  color:var(--digit);font-family:var(--serif);font-weight:700;line-height:1;
  font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1,"tnum" 1;
  text-shadow:0 2px 10px rgba(0,0,0,.4);
}
.top span{top:0}
.bot span{bottom:0}
.card::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:rgba(0,0,0,.65);z-index:6}
.card::before{content:"";position:absolute;left:calc(var(--s)*-.015);right:calc(var(--s)*-.015);top:50%;height:calc(var(--s)*.1);margin-top:calc(var(--s)*-.05);z-index:0}
.flip{display:none;z-index:4}
.card.flipping .flip{display:block}
.fl-top{top:0;transform-origin:50% 100%;animation:ft .3s ease-in forwards}
.fl-bot{bottom:0;transform-origin:50% 0;transform:rotateX(90deg);animation:fb .3s ease-out .3s forwards}
@keyframes ft{to{transform:rotateX(-90deg)}}
@keyframes fb{to{transform:rotateX(0)}}
.date{margin:clamp(28px,5vw,48px) 0 0;font-size:clamp(1.1rem,3.2vw,1.5rem);color:var(--muted)}
.date b{color:var(--title);font-weight:700}

/* date editor tucked in the corner */
#gear{
  position:fixed;z-index:10;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;
  width:40px;height:40px;border-radius:50%;border:1px solid var(--gold);background:transparent;color:var(--gold);
  display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.55;transition:opacity .2s;
}
#gear:hover,#gear:focus-visible{opacity:1}
.panel{
  position:fixed;z-index:10;top:calc(env(safe-area-inset-top,0px) + 62px);right:12px;width:min(280px,calc(100vw - 24px));
  background:var(--card2);color:var(--digit);border:1px solid var(--gold);border-radius:12px;padding:16px;display:none;text-align:left;
  box-shadow:0 14px 32px rgba(0,0,0,.4);
}
.panel.open{display:block}
.panel label{display:block;font-size:1rem;margin-bottom:8px}
.panel input{width:100%;font:inherit;font-size:1rem;padding:8px;border-radius:8px;border:1px solid var(--gold);background:var(--card1);color:var(--digit);color-scheme:dark}
.panel .btns{display:flex;gap:8px;margin-top:12px}
.panel button{flex:1;font:inherit;font-weight:700;padding:8px;border-radius:8px;border:1px solid var(--gold);cursor:pointer;background:transparent;color:var(--digit)}
.panel button.primary{background:var(--gold);color:var(--card2)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media (prefers-reduced-motion:reduce){
  .sparkles i{animation:none}
  .fl-top,.fl-bot{animation:none}
}
</style>
</head>
<body>
<div class="sparkles" id="sparkles" aria-hidden="true"></div>

<button id="gear" type="button" aria-label="Change wedding date" title="Change wedding date">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
</button>
<div class="panel" id="panel">
  <label for="dinput">Wedding date and time</label>
  <input type="datetime-local" id="dinput">
  <div class="btns">
    <button type="button" id="cancel">Cancel</button>
    <button type="button" id="save" class="primary">Save date</button>
  </div>
</div>

<main>
  <svg class="rings" viewBox="0 0 80 48" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true">
    <circle cx="29" cy="28" r="16"/><circle cx="51" cy="28" r="16"/>
    <path d="M29 4l4 5-4 5-4-5z" fill="currentColor" stroke="none"/>
  </svg>
  <h1 id="title">We’re getting married!</h1>
  <p class="sub" id="sub">Until we say “I do”</p>
  <div class="clock" id="clock" role="timer" aria-live="off"></div>
  <p class="date">Our big day: <b id="dlabel"></b></p>
</main>

<script>
(function(){
  var KEY="wedding-target";
  var target=new Date(2027,0,3,0,0,0); // 3 January 2027, 12:00 AM local time
  try{var s=localStorage.getItem(KEY);if(s){var d=new Date(s);if(!isNaN(d))target=d;}}catch(e){}
  var reduced=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;

  function pad(n){return String(n).padStart(2,"0");}
  function toLocalInput(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes());}

  function makeCard(){
    var el=document.createElement("div");el.className="card";
    el.innerHTML='<div class="half top"><span></span></div><div class="half bot"><span></span></div>'+
                 '<div class="half top flip fl-top"><span></span></div><div class="half bot flip fl-bot"><span></span></div>';
    var sp=el.querySelectorAll("span"),cur=null,timer=null;
    function finish(v){sp[1].textContent=v;el.classList.remove("flipping");}
    return{el:el,set:function(v){
      if(v===cur)return;
      if(timer){clearTimeout(timer);timer=null;finish(cur);}
      el.classList.toggle("wide",v.length>2);
      if(cur===null||reduced){sp[0].textContent=v;sp[1].textContent=v;}
      else{
        sp[2].textContent=cur;sp[3].textContent=v;sp[0].textContent=v;
        el.classList.remove("flipping");void el.offsetWidth;el.classList.add("flipping");
        timer=setTimeout(function(){timer=null;finish(v);},620);
      }
      cur=v;
    }};
  }

  var clock=document.getElementById("clock"),cards=[];
  ["Days","Hours","Minutes","Seconds"].forEach(function(name){
    var u=document.createElement("div");u.className="unit";
    var c=makeCard();cards.push(c);
    var l=document.createElement("div");l.className="label";l.textContent=name;
    u.appendChild(c.el);u.appendChild(l);clock.appendChild(u);
  });

  var title=document.getElementById("title"),sub=document.getElementById("sub"),label=document.getElementById("dlabel");
  function setLabel(){label.textContent=target.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});}

  function tick(){
    var diff=target-new Date();
    if(diff<=0){
      title.textContent="Today is the day!";sub.textContent="Congratulations to the happy couple";
      diff=0;
    }else{
      title.textContent="We’re getting married!";sub.textContent="Until we say “I do”";
    }
    var s=Math.floor(diff/1000);
    var vals=[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60];
    for(var i=0;i<4;i++)cards[i].set(pad(vals[i]));
  }

  // soft sparkles
  var sk=document.getElementById("sparkles");
  for(var i=0;i<22;i++){
    var p=document.createElement("i");
    p.style.left=(Math.random()*100)+"%";p.style.top=(Math.random()*100)+"%";
    p.style.animationDelay=(Math.random()*4)+"s";p.style.animationDuration=(3+Math.random()*4)+"s";
    var sz=2+Math.random()*4;p.style.width=sz+"px";p.style.height=sz+"px";
    sk.appendChild(p);
  }

  // date editor
  var panel=document.getElementById("panel"),input=document.getElementById("dinput");
  document.getElementById("gear").onclick=function(){input.value=toLocalInput(target);panel.classList.toggle("open");};
  document.getElementById("cancel").onclick=function(){panel.classList.remove("open");};
  document.getElementById("save").onclick=function(){
    var d=new Date(input.value);if(isNaN(d))return;
    target=d;try{localStorage.setItem(KEY,d.toISOString());}catch(e){}
    setLabel();panel.classList.remove("open");tick();
  };

  setLabel();tick();setInterval(tick,1000);
})();
</script>
</body>
</html>
